version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/RetailCategoryInsights.Api/Dockerfile
    container_name: retail-insights-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/retail_insights.db
      - Jwt__Secret=SuperSecretKeyForRetailCategoryInsightsDashboard2026!
      - Jwt__Issuer=RetailInsightsApi
      - Jwt__Audience=RetailInsightsClient
      # Optional: Provide OpenAI API Key for live LLM insights
      # - OpenAi__ApiKey=sk-your-openai-api-key
    volumes:
      - api_data:/app/data
    networks:
      - retail_network

  client:
    build:
      context: ./src/RetailCategoryInsights.Client
      dockerfile: Dockerfile
    container_name: retail-insights-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - retail_network

volumes:
  api_data:
    driver: local

networks:
  retail_network:
    driver: bridge
